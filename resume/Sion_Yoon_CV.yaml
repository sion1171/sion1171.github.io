design:
  theme: engineeringresumes
  page:
    top_margin: 0.45in
    bottom_margin: 0.45in
    left_margin: 0.55in
    right_margin: 0.55in
    show_top_note: false
  header:
    space_below_name: 0.35cm
    space_below_headline: 0.3cm
    space_below_connections: 0.3cm
    connections:
      phone_number_format: international
  typography:
    line_spacing: 0.6em
    alignment: left
    font_size:
      body: 10pt
      name: 24pt
      section_titles: 1.25em
    small_caps:
      section_titles: true
  section_titles:
    line_thickness: 0.9pt
    space_above: 0.45cm
    space_below: 0.25cm
  sections:
    space_between_regular_entries: 0.38cm
  entries:
    date_and_location_width: 4.1cm
    highlights:
      bullet: "•"  # replaced with an en dash by resume/build.py (RenderCV has no en-dash option)
      space_above: 0.1cm
      space_between_items: 0.07cm
  templates:
    experience_entry:
      main_column: "**COMPANY**, *POSITION* -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "**DATE**"
    education_entry:
      main_column: "**INSTITUTION**, *DEGREE_WITH_AREA* -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "**DATE**"
    publication_entry:
      main_column: "**TITLE**\nAUTHORS\nURL (JOURNAL)"
      date_and_location_column: "*DATE*"
